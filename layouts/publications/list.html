{{ define "main" }}
<div id="publications">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range hugo.Data.publications.sections }}
    <h2>{{ .title }}</h2>
    {{ range .papers }}{{ partial "paper.html" . }}{{ end }}
    {{ range .groups }}
      <h3 class="pub-group">{{ .title }}</h3>
      {{ range .papers }}{{ partial "paper.html" . }}{{ end }}
    {{ end }}
    <br>
  {{ end }}
</div>
{{ end }}
